[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-studying-agent"
version = "0.1.0"
description = "Scaffold for a parent-facing self-studying agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
